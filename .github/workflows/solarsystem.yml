name: Solar System Workflow

# This workflow uses a matrix to test several OSs at the same time
# Excludes nodejs v 18,  
#checks out the repo, set up node, installs dependencies, unit testing, using an ID to speicifiy a
# single job
#

# on push, manual(push), and on branches "main" and any that start with "feature"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

# env variable for the whole job, at this level: 
env: # set varables for the whole workflow using env variables
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

# 2 jobs  Unit-testing tests 5 OS's using a matrix, excluding nodeJS v18 on macOS    
jobs:
    unit-testing:
        name: Unit testing  # using matrix to run tests on several version of nodeJS but excluding v18 for MacOS-latest L24
        services:
          mongo-db-nonprod:
            image: siddharth67/mongo-db:non-prod 
            ports: 
              - 27017:27017
        env: # set varables for this job for the nonprod db
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: non-prod-user  #  NEVER hard code credentials!!!
          MONGO_PASSWORD: non-prod-password
        strategy: 
          matrix:
            nodejs-version: [18, 19, 20]
            operating_system: [ubuntu-latest]
            exclude:
              - nodejs-version: 18
                operating_system: macos-latest
        runs-on: ${{ matrix.operating_system }}
        steps:  # check out the repo using github actions
        - name: Check out Repo
          uses: actions/checkout@v4

        - name: Setup NodeJS Version ${{ matrix.nodejs-version }}  # set up different version of nodeJS  version 18
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.nodejs-version }}

        - name: Cache NPM Dependancies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}    
            
        - name: Install Dependancies
          run: npm install

        - name: Unit Testing
          id: Unit-Testing-13Jan2024-308pm
          run: npm test

        - name: Archive Test Result #Archive/save the tests results
          if: always()
          #failure() && 
          #(steps.Unit-Testing-13Jan2024-308pm.outcome == 'failure' || steps.Unit-Testing-13Jan2024-308pm.outcome == 'success')
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: ${{ matrix.os }}-${{ steps.timestamp.outputs.time }}-test-results.xml
            # gave the file a unique name to pass all test.

    code-coverage:
      name: Code Coverage
      container:  #  setting this up, we commented out L94-97
        image: node:18
      services:
        mongo-db:
          image: siddharth67/mongo-db:non-prod 
          options: 
              --name mongo
          #ports: 
          #  - 27017:27017
      env: # set varables for this job for the nonprod db
        MONGO_URI: 'mongodb://mongo:27017/superData'
        MONGO_USERNAME: non-prod-user  #  NEVER hard code credentials!!!
        MONGO_PASSWORD: non-prod-password        
      runs-on: ubuntu-latest
      steps:
        - name: Check out Repo
          uses: actions/checkout@v4

        # - name: Set up NodeJs Version - 18
        #   uses: actions/setup-node@v4
        #   with:
        #     node-version: 18

        - name: Cache NPM Dependancies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}


        - name: Install Dependancies
          run: npm install

        - name: Check Code Coverage
          continue-on-error: true   # continue to ru the next job even if this one fails
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with: 
              name: Code Coverage Result
              path: ./coverage
              retention-days: 1

    Docker: 
        name: Containerization
        needs: [code-coverage, unit-testing]  # "needs" is used to make sure the other jobs finish first before running this one.
        permissions: 
          packages: write  # had to give this job permission to write packages in GitHub.
        runs-on: ubuntu-latest
        steps:
          - name: checkout Repo
            uses: actions/checkout@v4

          - name: DockerHub Login
            uses: docker/login-action@v3
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}  # not your name and in lower case; fixed error
              password: ${{ secrets.DOCKERHUB_PASSWORD }}
          
          - name: GitHub Container Registry Log in
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}  # not your name and in lower case; fixed error
              password: ${{ secrets.GITHUB_TOKEN }}

              
          - name: Docker Build
            uses: docker/build-push-action@v6
            with:
              context: .
              push: false
              tags: ${{ vars.DOCKERHUB_USERNAME }}/solarsystem:${{ github.sha }}

          - name: Docker Image Test
            run: |
              docker images
              docker run --name solar-system-app -d \
                  -p 3000:3000 \
                  -e MONGO_URI=$MONGO_URI \
                  -e MONGO_USERNAME=$MONGO_USERNAME \
                  -e MONGO_PASSWORD=$MONGO_PASSWORD \
                  ${{ vars.DOCKERHUB_USERNAME }}/solarsystem:${{ github.sha }}
              export IP=$( docker inspect -f '{{ range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
              echo $IP

              echo "Testing Image URL using wget"
              wget -q -O - 127.0.0.0:3000/live | grep live

          - name: Docker  and GHCR Pushes
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: |
                ${{ vars.DOCKERHUB_USERNAME }}/solarsystem:${{ github.sha }}
                ghcr.io/shanmorton/solarsystem:${{ github.sha }}

    Dev-Deploy:
      needs: Docker
      runs-on: ubuntu-latest
      steps:
        - name: checkout Repo
          uses: actions/checkout@v4

        - name: Install KubeCTL
          uses: azure/setup-kubectl@v4
          with:
             version: 'v1.32.1' # default is latest stable

        - name: Confirm KubeCTL Info
          run: |
            kubectl version --short
            echo -----------------------------------
            kubectl get nodes

        

